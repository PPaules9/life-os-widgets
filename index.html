<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Life OS Daily Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: one dark card. Top band: clock on the left, the Arabic verse of the day on the right (RTL).
   Bottom band: My Manifesto, one principle at a time (new one each visit and every 20s).
   Stacks on phones. Single dark look to sit inside the dark Notion page. */
:root{
  --bg:#141020; --fg:#efeafb; --muted:#9b90bd; --accent:#b388ff; --line:#2b2347;
  --display:"Fraunces",Georgia,serif; --body:"Manrope",system-ui,sans-serif;
  --arabic:"Amiri","Geeza Pro","Noto Naskh Arabic",serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:transparent}
body{color:var(--fg);font-family:var(--body)}
.card{box-sizing:border-box;height:100%;background:var(--bg);border-radius:16px;
  padding:16px max(22px,env(safe-area-inset-right,0px)) 14px max(22px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;overflow:auto;scrollbar-width:none}
.card::-webkit-scrollbar{display:none}

/* top band: clock | verse */
.top{flex:1 1 auto;display:flex;gap:28px;align-items:center}
.clock{flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;justify-content:center;padding-right:28px;border-right:1px solid var(--line);min-width:150px}
.time{font-family:var(--display);font-weight:300;font-size:52px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.time small{font-size:18px;color:var(--accent);margin-left:4px;font-family:var(--body);font-weight:500}
.date{color:var(--muted);font-size:13px;margin-top:8px;letter-spacing:.04em;text-transform:uppercase}
.verse{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;font-family:var(--arabic)}
.verse .eyebrow{font-weight:700;font-size:15px;color:var(--accent)}
.verse .text{margin:0;font-size:25px;line-height:1.7;text-wrap:balance}
.verse .ref{font-size:16px;color:var(--muted)}

/* bottom band: manifesto */
.manifesto{flex:0 0 auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.line{font-family:var(--display);font-weight:500;font-size:25px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;transition:opacity .35s}
.sub{font-family:var(--display);font-style:italic;font-weight:300;font-size:17px;line-height:1.4;color:var(--muted);max-width:62ch;transition:opacity .35s}
.fade{opacity:0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:2px}
.rail{display:flex;gap:6px}
.rail i{width:18px;height:3px;border-radius:2px;background:var(--line)}
.rail i.on{background:var(--accent)}
.foot button{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13px;letter-spacing:.08em;padding:4px 12px;border-radius:999px;cursor:pointer}
.foot button:hover,.foot button:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}

@media (max-width:560px){
  .card{gap:10px;padding:12px 16px}
  .top{flex-direction:column;align-items:stretch;gap:12px}
  .clock{flex-direction:row;align-items:baseline;justify-content:space-between;gap:12px;min-width:0;padding:0 0 10px;border-right:0;border-bottom:1px solid var(--line)}
  .time{font-size:36px}.time small{font-size:15px}
  .date{margin-top:0;font-size:11px;text-align:right}
  .verse .text{font-size:20px;line-height:1.65}
  .line{font-size:21px}.sub{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.line,.sub{transition:none}}
</style></head><body>
<div class="card">
  <div class="top">
    <div class="clock">
      <div class="time" id="time" aria-live="off">--:--<small id="ampm"></small></div>
      <div class="date" id="date"></div>
    </div>
    <div class="verse" dir="rtl" lang="ar">
      <div class="eyebrow">آية اليوم</div>
      <p class="text" id="vtext"></p>
      <div class="ref" id="vref"></div>
    </div>
  </div>
  <div class="manifesto">
    <div class="label">My Manifesto</div>
    <div class="line" id="line"></div>
    <div class="sub" id="sub"></div>
    <div class="foot"><div class="rail" id="rail" aria-hidden="true"></div><button id="next" type="button">Next ›</button></div>
  </div>
</div>
<script src="manifesto-lines.js"></script>
<script>
const TZ="Africa/Cairo";
/* Verse of the day: Van Dyke Arabic Bible (ترجمة فاندايك), one per day, same verse all day. */
const verses=[
["توكّل على الرب بكل قلبك، وعلى فهمك لا تعتمد. في كل طرقك اعرفه، وهو يقوّم سبلك.","أمثال ٣: ٥-٦"],
["وكان الرب مع يوسف فكان رجلًا ناجحًا.","تكوين ٣٩: ٢"],
["كونوا قديسين لأني أنا قدوس.","١ بطرس ١: ١٦"],
["أستطيع كل شيء في المسيح الذي يقوّيني.","فيلبي ٤: ١٣"],
["ألقِ على الرب أعمالك فتُثبَّت أفكارك.","أمثال ١٦: ٣"],
["لكن اطلبوا أولًا ملكوت الله وبرّه، وهذه كلها تُزاد لكم.","متى ٦: ٣٣"],
["وكل ما فعلتم، فاعملوا من القلب، كما للرب ليس للناس.","كولوسي ٣: ٢٣"],
["فآمن بالرب فحسبه له برًّا.","تكوين ١٥: ٦"],
["فآمن إبراهيم بالله فحُسب له برًّا، ودُعي خليل الله.","يعقوب ٢: ٢٣"],
["لأني عرفت الأفكار التي أنا مفتكر بها عنكم، يقول الرب، أفكار سلام لا شر، لأعطيكم آخرة ورجاء.","إرميا ٢٩: ١١"],
["أم لستم تعلمون أن جسدكم هو هيكل للروح القدس الذي فيكم؟ … فمجّدوا الله في أجسادكم وفي أرواحكم التي هي لله.","١ كورنثوس ٦: ١٩-٢٠"],
["أما أمرتك؟ تشدّد وتشجّع. لا ترهب ولا ترتعب، لأن الرب إلهك معك حيثما تذهب.","يشوع ١: ٩"],
["أيها الرجال، أحبّوا نساءكم كما أحبّ المسيح أيضًا الكنيسة وأسلم نفسه لأجلها.","أفسس ٥: ٢٥"],
["فالذي جمعه الله لا يفرّقه إنسان.","مرقس ١٠: ٩"],
["أفكار المجتهد إنما هي للخصب، وكل عجول إنما هو للعوز.","أمثال ٢١: ٥"],
["فليضئ نوركم هكذا قدّام الناس، لكي يروا أعمالكم الحسنة ويمجّدوا أباكم الذي في السماوات.","متى ٥: ١٦"],
["الأمين في القليل أمين أيضًا في الكثير، والظالم في القليل ظالم أيضًا في الكثير.","لوقا ١٦: ١٠"],
["يا رب، بالغداة تسمع صوتي. بالغداة أوجّه صلاتي نحوك وأنتظر.","مزمور ٥: ٣"],
["كُفّوا واعلموا أني أنا الله. أتعالى بين الأمم، أتعالى في الأرض.","مزمور ٤٦: ١٠"],
["ولا تشاكلوا هذا الدهر، بل تغيّروا عن شكلكم بتجديد أذهانكم، لتختبروا ما هي إرادة الله الصالحة المرضية الكاملة.","رومية ١٢: ٢"],
["الجواب الليّن يصرف الغضب، والكلام الموجع يهيّج السخط.","أمثال ١٥: ١"],
["البطيء الغضب خير من الجبار، ومالك روحه خير ممن يأخذ مدينة.","أمثال ١٦: ٣٢"],
["بدء الحكمة مخافة الرب، ومعرفة القدوس فهم.","أمثال ٩: ١٠"],
["فلا نفشل في عمل الخير لأننا سنحصد في وقته إن كنا لا نكلّ.","غلاطية ٦: ٩"],
["اقتربوا إلى الله فيقترب إليكم.","يعقوب ٤: ٨"],
["بالمحبة اخدموا بعضكم بعضًا.","غلاطية ٥: ١٣"],
["سراج لرجلي كلامك، ونور لسبيلي.","مزمور ١١٩: ١٠٥"],
["اشكروا في كل شيء، لأن هذه هي مشيئة الله في المسيح يسوع من جهتكم.","١ تسالونيكي ٥: ١٨"],
["إحصاء أيامنا هكذا علّمنا فنؤتى قلب حكمة.","مزمور ٩٠: ١٢"],
["واثقًا بهذا عينه أن الذي ابتدأ فيكم عملًا صالحًا يكمّل إلى يوم يسوع المسيح.","فيلبي ١: ٦"],
["ملقين كل همّكم عليه، لأنه هو يعتني بكم.","١ بطرس ٥: ٧"]
];
function dayIndex(){
  const p=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  const [y,m,d]=p.split("-").map(Number);
  const n=Math.floor(Date.UTC(y,m-1,d)/86400000);
  return ((n%verses.length)+verses.length)%verses.length;
}
function tick(){
  const now=new Date();
  const t=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true}).formatToParts(now);
  const h=t.find(x=>x.type==="hour").value, m=t.find(x=>x.type==="minute").value, ap=t.find(x=>x.type==="dayPeriod").value;
  document.getElementById("time").firstChild.nodeValue=h+":"+m;
  document.getElementById("ampm").textContent=ap;
  document.getElementById("date").textContent=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"}).format(now)+" · Cairo";
}
const v=verses[dayIndex()];
document.getElementById("vtext").textContent="«"+v[0]+"»";
document.getElementById("vref").textContent=v[1];
tick(); setInterval(tick,1000);

/* Manifesto rotator */
const lines=window.MANIFESTO||[];
const rail=document.getElementById("rail"), el=document.getElementById("line"), sub=document.getElementById("sub");
let i=Math.floor(Math.random()*lines.length);
lines.forEach(()=>rail.appendChild(document.createElement("i")));
function show(){
  el.textContent=lines[i][0]; sub.textContent=lines[i][1];
  [...rail.children].forEach((d,k)=>d.classList.toggle("on",k===i));
}
function advance(){
  el.classList.add("fade"); sub.classList.add("fade");
  setTimeout(()=>{i=(i+1)%lines.length;show();el.classList.remove("fade");sub.classList.remove("fade");},350);
}
if(lines.length){
  show();
  let timer=setInterval(advance,20000);
  document.getElementById("next").addEventListener("click",()=>{clearInterval(timer);advance();timer=setInterval(advance,20000);});
}else{
  document.querySelector(".manifesto").hidden=true;
}
</script>
</body></html>
