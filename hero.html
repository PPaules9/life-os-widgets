try{seen=localStorage.getItem("lifeos-hero-intro")===new Intl.DateTimeFormat("en-CA",{timeZone:"Africa/Cairo",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}catch(e){}

<style>
/* Life OS, top of the page: one card instead of three blocks.
   Wide (1000px+):  [ now: Cairo time, date, weather ] [ North Star ] [ verse of the day, Arabic RTL ]
                    [                                ] [ My Manifesto, one line at a time, 20s each   ]
   Medium: "now" becomes a strip across the top. Phone (<640px): two swipeable pages, each fits the embed.
   Motion is calm on purpose: one load sequence (the clock rolls in, the North Star lights up star by star),
   then only a breathing colon, a slow weather glyph, an occasional twinkle and the manifesto timer.
   The load sequence plays once a day (Cairo time). Notion reloads the embed every time you come back to the
   page or scroll past it, so later loads that day skip it and show the card straight away.
   Content: north-star.js (North Star), manifesto-lines.js (My Manifesto), verses in the script below.
   Type is soft and warm on purpose: Fraunces with its SOFT axis at 100 (clock, temperature, manifesto),
   rounded Nunito for everything else, handwritten labels (Caveat; Aref Ruqaa for آية اليوم), Amiri for the verse. */
:root{
  --bg:#141020;--fg:#efeafb;--muted:#9b90bd;--accent:#b388ff;--line:#2b2347;
  --display:"Fraunces",Georgia,serif;--body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --arabic:"Amiri","Geeza Pro","Noto Naskh Arabic",serif;
  --ease:cubic-bezier(.2,.75,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:transparent}
body{color:var(--fg);font-family:var(--body);font-variation-settings:"SOFT" 100;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h2,p,ul{margin:0;padding:0;font:inherit}
ul{list-style:none}
[hidden]{display:none!important}

.card{height:100%;overflow:hidden auto;scrollbar-width:none;background:var(--bg);border-radius:16px;
  display:grid;grid-template-columns:minmax(212px,19%) minmax(0,1fr) minmax(0,1.2fr);grid-template-rows:1fr auto;
  grid-template-areas:"now star verse" "now mani mani";
  padding:20px max(26px,env(safe-area-inset-right,0px)) 18px max(26px,env(safe-area-inset-left,0px))}
.card::-webkit-scrollbar,.page::-webkit-scrollbar{display:none}
.page{display:contents}
.label{display:flex;align-items:center;gap:9px;font-family:"Caveat",var(--body);font-size:20px;font-weight:600;line-height:18px;letter-spacing:0;color:var(--accent)}

/* now: Cairo time, date, weather. On wide cards it shares the two rows of the grid (subgrid),
   so the weather details start on the same line as My Manifesto. */
.now{grid-area:now;min-width:0;display:grid;grid-template-rows:subgrid;border-right:1px solid var(--line)}
.now-a{display:flex;flex-direction:column;gap:20px;padding:0 24px 20px 0}
.wx-more{display:flex;flex-direction:column;justify-content:space-between;gap:12px;padding:15px 24px 0 0;border-top:1px solid var(--line)}
.time{display:flex;align-items:baseline;font-family:var(--display);font-weight:400;font-size:54px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.time .d{display:inline-block}
.time .colon{display:inline-block;padding:0 .02em;animation:breathe 2s ease-in-out infinite}
.time .ap{margin-left:7px;font-family:var(--body);font-size:15px;font-weight:600;letter-spacing:.04em;color:var(--accent)}
.date{margin-top:9px;font-size:13px;color:var(--muted)}
.wx-head{display:flex;flex-direction:column;gap:8px}
.wx-now{display:flex;align-items:center;gap:10px}
.glyph{width:36px;height:36px;flex:none;color:var(--accent)}
.temp{font-family:var(--display);font-weight:400;font-size:40px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.temp sup{position:relative;top:3px;margin-left:2px;font-family:var(--body);font-size:13px;font-weight:500;letter-spacing:0;color:var(--muted);vertical-align:top}
.cond{font-size:13px;font-weight:600}
.meta{display:grid;grid-template-columns:auto auto;justify-content:start;gap:3px 14px;font-size:12px;color:var(--muted)}
.meta b{font-weight:600;color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.day{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)}
.day b{font-size:12px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{display:block;width:18px;height:18px}
svg.ic{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.ic .cloud{fill:var(--bg)}
svg.ic .dot{fill:currentColor;stroke:none}

/* North Star */
.star{grid-area:star;min-width:0;display:flex;flex-direction:column;gap:15px;padding:2px 28px 20px}
.polaris{position:relative;width:20px;height:20px;flex:none}
.polaris::before{content:"";position:absolute;inset:-11px;border-radius:50%;background:radial-gradient(closest-side,rgba(179,136,255,.5),rgba(179,136,255,0));animation:halo 5.5s ease-in-out infinite alternate}
.polaris svg{position:relative;display:block;width:100%;height:100%;fill:var(--accent)}
.goals{display:flex;flex-direction:column;gap:12px}
.goals li{display:flex;align-items:flex-start;gap:12px;font-size:16px;font-weight:600;line-height:1.35}
.spark{flex:none;width:11px;height:11px;margin-top:5px;fill:var(--accent)}

/* verse of the day */
.verse{grid-area:verse;min-width:0;display:flex;flex-direction:column;gap:8px;padding:2px 0 20px 6px;font-family:var(--arabic)}
.verse .label{font-family:"Aref Ruqaa",var(--arabic);font-size:19px;font-weight:400;line-height:28px;letter-spacing:0}
.vtext{font-size:26px;line-height:1.65;text-wrap:balance}
.vref{padding-inline-start:.35em;font-style:normal;font-size:15px;color:var(--muted);white-space:nowrap}

/* My Manifesto */
.mani{grid-area:mani;min-width:0;display:flex;flex-direction:column;gap:6px;padding:15px 0 0 28px;border-top:1px solid var(--line)}
.slide{transition:opacity .45s ease,transform .45s var(--ease)}
.slide.out{opacity:0;transform:translateY(-5px)}
.line{font-family:var(--display);font-weight:500;font-size:25px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sub{margin-top:5px;max-width:70ch;font-family:var(--display);font-style:italic;font-weight:400;font-size:17px;line-height:1.4;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:6px}
.rail{display:flex;gap:6px}
.rail i{position:relative;width:22px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.rail b{position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left center}
.rail i.on b{animation:fill 20s linear forwards}
.mani:hover .rail i.on b{animation-play-state:paused}
.next{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:13px;letter-spacing:.06em;padding:4px 12px;border-radius:999px;cursor:pointer;transition:color .2s,border-color .2s}
.next:hover,.next:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
.dots{display:none;position:fixed;left:50%;bottom:9px;transform:translateX(-50%);gap:7px;z-index:2}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);cursor:pointer;transition:background .25s}
.dots i.on{background:var(--accent)}

/* ambient motion */
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes halo{from{opacity:.3;transform:scale(.8)}to{opacity:.9;transform:scale(1.15)}}
@keyframes fill{to{transform:scaleX(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%,100%{transform:translateX(-.7px)}50%{transform:translateX(.9px)}}
@keyframes fall{0%{transform:translateY(-2px);opacity:0}25%{opacity:1}100%{transform:translateY(3px);opacity:0}}
@keyframes flash{0%,84%,100%{opacity:.6}86%{opacity:1}88%{opacity:.5}90%{opacity:1}94%{opacity:.6}}
@keyframes haze{0%,100%{transform:translateX(-1.2px)}50%{transform:translateX(1.2px)}}
@keyframes twk{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
@keyframes twinkle{0%,100%{transform:none}40%{transform:scale(1.6) rotate(22deg)}}
@keyframes roll{from{opacity:0;transform:translateY(.3em)}to{opacity:1;transform:none}}
.glyph .spin{transform-box:fill-box;transform-origin:center;animation:spin 50s linear infinite}
.glyph .drift{animation:drift 7s ease-in-out infinite}
.glyph .fall>*{animation:fall 1.7s ease-in infinite}
.glyph .fall>:nth-child(2){animation-delay:.55s}
.glyph .fall>:nth-child(3){animation-delay:1.1s}
.glyph .flash{animation:flash 6s linear infinite}
.glyph .haze{animation:haze 6s ease-in-out infinite}
.glyph .haze+.haze{animation-delay:-2s}
.glyph .haze+.haze+.haze{animation-delay:-4s}
.glyph .twk{transform-box:fill-box;transform-origin:center;animation:twk 4s ease-in-out infinite}
.spark.tw{animation:twinkle 1.4s ease-in-out}
.d.roll{animation:roll .55s var(--ease)}

/* load sequence: once a day (the head script adds .js only on the day's first load), only when motion is allowed */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(.45em)}to{opacity:1;transform:none}}
@keyframes ignite{from{opacity:0;transform:scale(.3) rotate(-135deg)}to{opacity:1;transform:none}}
@keyframes light{0%{opacity:0;transform:scale(.2)}55%{opacity:1;transform:scale(1.7)}100%{opacity:1;transform:none}}
.js .in,.js .time .d,.js .polaris,.js .goals li{opacity:0}
.js .time .colon{opacity:0;animation:none}
.go .in{animation:fadein .9s ease both;animation-delay:var(--at,0s)}
.go .time .d{animation:rise .85s var(--ease) .1s both}
.go .time #mm{animation-delay:.2s}
.go .time .colon{animation:rise .85s var(--ease) .15s both}
.go .polaris{animation:fadein .5s ease .6s both}
.go .polaris svg{animation:ignite 1.2s var(--ease) .6s both}
.go .goals li{animation:fadein .8s ease both;animation-delay:calc(1.05s + var(--k)*.16s)}
.go .goals .spark{animation:light .95s var(--ease) both;animation-delay:calc(1.05s + var(--k)*.16s)}

/* short embed (Notion's default embed is 320px tall): same layout, tighter spacing */
@media (min-width:1000px) and (max-height:359px){
  .card{padding-top:16px;padding-bottom:14px}
  .now-a{gap:12px;padding-bottom:14px}
  .time{font-size:48px}.date{margin-top:6px}
  .temp{font-size:36px}.glyph{width:32px;height:32px}
  .wx-more{gap:8px;padding-top:12px}
  .star{gap:10px;padding-bottom:14px}
  .goals{gap:8px}
  .verse{gap:6px;padding-bottom:14px}
  .vtext{font-size:24px;line-height:1.6}
  .mani{gap:4px;padding-top:12px}
  .line{font-size:23px}
  .sub{margin-top:3px;font-size:16px}
  .foot{margin-top:4px}
}

/* medium: Notion page at normal width, iPad */
@media (max-width:999px){
  .card{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);grid-template-rows:auto 1fr auto;grid-template-areas:"now now" "star verse" "mani mani";
    padding:16px max(22px,env(safe-area-inset-right,0px)) 16px max(22px,env(safe-area-inset-left,0px))}
  .now{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 0 12px;border-right:0;border-bottom:1px solid var(--line)}
  .now-a{flex-direction:row;align-items:center;gap:40px;padding:0}
  .wx-head{flex-direction:row;align-items:center;gap:14px}
  .wx-more{flex-direction:row;align-items:center;gap:16px;padding:0;border-top:0}
  .time{font-size:44px}
  .days{padding-left:16px;border-left:1px solid var(--line);grid-template-columns:repeat(3,auto);column-gap:16px}
  .star{padding:14px 24px 14px 0}
  .verse{padding:14px 0 14px 4px}
  .vtext{font-size:23px}
  .mani{padding:14px 0 0}
}
@media (max-width:860px){.meta{display:none}}

/* phone: two pages side by side, swipe between them */
@media (max-width:639px){
  .card{display:flex;overflow:auto hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;padding:0}
  .page{display:flex;flex-direction:column;flex:0 0 100%;min-width:0;height:100%;overflow:hidden auto;scrollbar-width:none;scroll-snap-align:start;scroll-snap-stop:always;
    gap:14px;padding:14px max(18px,env(safe-area-inset-right,0px)) 28px max(18px,env(safe-area-inset-left,0px))}
  .p2{justify-content:center}
  .now{flex:none;padding:0 0 12px}
  .now-a{width:100%;justify-content:space-between;gap:12px}
  .wx-head{flex-direction:column;align-items:flex-end;gap:4px}
  .wx-more{display:none}
  .time{font-size:36px}.time .ap{margin-left:5px;font-size:12px}
  .date{margin-top:6px;font-size:12px}
  .glyph{width:26px;height:26px}.temp{font-size:30px}
  .cond{font-size:12px;font-weight:500;color:var(--muted)}
  .verse{flex:1 0 auto;justify-content:center;padding:0}
  .vtext{font-size:22px;line-height:1.65}
  .star{flex:none;gap:12px;padding:0}
  .goals{gap:9px}.goals li{gap:10px;font-size:15px}.spark{margin-top:4px}
  .mani{flex:none;padding:14px 0 0}
  .line{font-size:20px}.sub{font-size:15px}
  .dots{display:flex}
}
@media (max-width:639px) and (max-height:359px){
  .page{gap:10px;padding-top:10px;padding-bottom:22px}
  .star{gap:10px}
  .goals{gap:6px}
  .mani{padding-top:10px}
  .vtext{font-size:21px}
  .dots{bottom:7px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rail i.on b{transform:none}
}
</style></head><body>
<main class="card" id="card">
  <div class="page p1">
    <section class="now" aria-label="Cairo time and weather">
      <div class="now-a">
        <div class="clock">
          <div class="time"><span class="d" id="hh">--</span><span class="colon">:</span><span class="d" id="mm">--</span><span class="ap" id="ap"></span></div>
          <p class="date in" id="date" style="--at:.3s"></p>

      </div>

<script>
(()=>{
"use strict";
const TZ="Africa/Cairo",root=document.documentElement,$=id=>document.getElementById(id);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let settled=reduce;

/* ---- Clock: always Cairo time ---- */
const tf=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit",hour12:true});
const df=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,weekday:"long",day:"numeric",month:"long"});
function put(el,v){
  if(el.textContent===v)return;
  el.textContent=v;
  if(settled&&!reduce){el.classList.remove("roll");void el.offsetWidth;el.classList.add("roll");}
}
function tick(){
  const now=new Date(),p=tf.formatToParts(now),g=t=>(p.find(x=>x.type===t)||{}).value||"";
  put($("hh"),g("hour"));put($("mm"),g("minute"));$("ap").textContent=g("dayPeriod").toUpperCase();
  $("date").textContent=df.format(now);
}
tick();setInterval(tick,1000);

/* ---- Verse of the day: Van Dyke Arabic Bible (ترجمة فاندايك), one per day, same verse all day ---- */
const verses=[
["توكّل على الرب بكل قلبك، وعلى فهمك لا تعتمد. في كل طرقك اعرفه، وهو يقوّم سبلك.","أمثال ٣: ٥-٦"],
["وكان الرب مع يوسف فكان رجلًا ناجحًا.","تكوين ٣٩: ٢"],
["كونوا قديسين لأني أنا قدوس.","١ بطرس ١: ١٦"],
["أستطيع كل شيء في المسيح الذي يقوّيني.","فيلبي ٤: ١٣"],
["ألقِ على الرب أعمالك فتُثبَّت أفكارك.","أمثال ١٦: ٣"],
["لكن اطلبوا أولًا ملكوت الله وبرّه، وهذه كلها تُزاد لكم.","متى ٦: ٣٣"],
["وكل ما فعلتم، فاعملوا من القلب، كما للرب ليس للناس.","كولوسي ٣: ٢٣"],
["فآمن بالرب فحسبه له برًّا.","تكوين ١٥: ٦"],
["فآمن إبراهيم بالله فحُسب له برًّا، ودُعي خليل الله.","يعقوب ٢: ٢٣"],
["لأني عرفت الأفكار التي أنا مفتكر بها عنكم، يقول الرب، أفكار سلام لا شر، لأعطيكم آخرة ورجاء.","إرميا ٢٩: ١١"],
["أم لستم تعلمون أن جسدكم هو هيكل للروح القدس الذي فيكم؟ … فمجّدوا الله في أجسادكم وفي أرواحكم التي هي لله.","١ كورنثوس ٦: ١٩-٢٠"],
["أما أمرتك؟ تشدّد وتشجّع. لا ترهب ولا ترتعب، لأن الرب إلهك معك حيثما تذهب.","يشوع ١: ٩"],
["أيها الرجال، أحبّوا نساءكم كما أحبّ المسيح أيضًا الكنيسة وأسلم نفسه لأجلها.","أفسس ٥: ٢٥"],
["فالذي جمعه الله لا يفرّقه إنسان.","مرقس ١٠: ٩"],
["أفكار المجتهد إنما هي للخصب، وكل عجول إنما هو للعوز.","أمثال ٢١: ٥"],
["فليضئ نوركم هكذا قدّام الناس، لكي يروا أعمالكم الحسنة ويمجّدوا أباكم الذي في السماوات.","متى ٥: ١٦"],
["الأمين في القليل أمين أيضًا في الكثير، والظالم في القليل ظالم أيضًا في الكثير.","لوقا ١٦: ١٠"],
["يا رب، بالغداة تسمع صوتي. بالغداة أوجّه صلاتي نحوك وأنتظر.","مزمور ٥: ٣"],
["كُفّوا واعلموا أني أنا الله. أتعالى بين الأمم، أتعالى في الأرض.","مزمور ٤٦: ١٠"],
["ولا تشاكلوا هذا الدهر، بل تغيّروا عن شكلكم بتجديد أذهانكم، لتختبروا ما هي إرادة الله الصالحة المرضية الكاملة.","رومية ١٢: ٢"],
["الجواب الليّن يصرف الغضب، والكلام الموجع يهيّج السخط.","أمثال ١٥: ١"],
["البطيء الغضب خير من الجبار، ومالك روحه خير ممن يأخذ مدينة.","أمثال ١٦: ٣٢"],
["بدء الحكمة مخافة الرب، ومعرفة القدوس فهم.","أمثال ٩: ١٠"],
["فلا نفشل في عمل الخير لأننا سنحصد في وقته إن كنا لا نكلّ.","غلاطية ٦: ٩"],
["اقتربوا إلى الله فيقترب إليكم.","يعقوب ٤: ٨"],
["بالمحبة اخدموا بعضكم بعضًا.","غلاطية ٥: ١٣"],
["سراج لرجلي كلامك، ونور لسبيلي.","مزمور ١١٩: ١٠٥"],
["اشكروا في كل شيء، لأن هذه هي مشيئة الله في المسيح يسوع من جهتكم.","١ تسالونيكي ٥: ١٨"],
["إحصاء أيامنا هكذا علّمنا فنؤتى قلب حكمة.","مزمور ٩٠: ١٢"],
["واثقًا بهذا عينه أن الذي ابتدأ فيكم عملًا صالحًا يكمّل إلى يوم يسوع المسيح.","فيلبي ١: ٦"],
["ملقين كل همّكم عليه، لأنه هو يعتني بكم.","١ بطرس ٥: ٧"]
];
const pd=new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"});
let vday=-1;
function verse(){
  const [y,m,d]=pd.format(new Date()).split("-").map(Number),n=Math.floor(Date.UTC(y,m-1,d)/864e5);
  const k=((n%verses.length)+verses.length)%verses.length;
  if(k===vday)return;vday=k;
  $("vq").textContent="«"+verses[k][0]+"»";$("vref").textContent=verses[k][1];
}
verse();setInterval(verse,6e4);

/* ---- North Star ---- */
const SPARK='<svg class="spark" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0Q6.9 5.1 12 6Q6.9 6.9 6 12Q5.1 6.9 0 6Q5.1 5.1 6 0Z"/></svg>';
const goals=Array.isArray(window.NORTH_STAR)?window.NORTH_STAR:[],ul=$("goals");
goals.forEach((g,k)=>{const li=document.createElement("li");li.style.setProperty("--k",k);li.innerHTML=SPARK+"<span></span>";li.lastChild.textContent=g;ul.appendChild(li);});
if(!goals.length)$("star").hidden=true;
ul.addEventListener("animationend",e=>{if(e.animationName==="twinkle")e.target.classList.remove("tw");});
setInterval(()=>{
  if(!settled||reduce||document.hidden)return;
  const s=ul.querySelectorAll(".spark");if(!s.length)return;
  const el=s[Math.floor(Math.random()*s.length)];el.classList.remove("tw");void el.getBoundingClientRect();el.classList.add("tw");
},3800);

/* ---- Weather: Open-Meteo, no key. Refreshes every 30 minutes ---- */
const WX="https://api.open-meteo.com/v1/forecast?latitude=30.0444&longitude=31.2357&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Africa%2FCairo&forecast_days=4";
const NAME=c=>c===0?"Clear sky":c<=2?"Partly cloudy":c===3?"Overcast":c<=48?"Fog":c<=57?"Drizzle":c<=67?"Rain":c<=77?"Snow":c<=82?"Showers":c<=86?"Snow showers":"Thunderstorm";
const KIND=c=>c===0?"clear":c<=2?"partly":c===3?"cloud":c<=48?"fog":c<=67?"rain":c<=77?"snow":c<=82?"rain":c<=86?"snow":"storm";
function icon(kind,day){
  const sun='<g class="spin"><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.93 4.93l1.7 1.7M17.37 17.37l1.7 1.7M4.93 19.07l1.7-1.7M17.37 6.63l1.7-1.7"/></g><circle cx="12" cy="12" r="4.5"/>';
  const moon='<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/><path class="twk" d="M18.4 2.6v2.6M17.1 3.9h2.6"/>';
  const sunS='<g class="spin"><path d="M8 2.2v1.4M8 12.4v1.4M2.2 8h1.4M12.4 8h1.4M4.18 4.18l.71.71M11.82 4.18l-.71.71M4.18 11.82l.71-.71M11.82 11.82l-.71-.71"/></g><circle cx="8" cy="8" r="2.9"/>';
  const moonS='<path d="M12.75 8.23A4.95 4.95 0 1 1 7.37 2.85 3.85 3.85 0 0 0 12.75 8.23z"/>';
  const cloudP='<path class="cloud drift" d="M9 19h9a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 8.9 11.4 3.8 3.8 0 0 0 9 19z"/>';
  const cloud='<path class="cloud drift" d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.3 4.5 4.5 0 0 0 7 18z"/>';
  const cloudHi='<path class="cloud drift" d="M7 14.5h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 5.8 4.5 4.5 0 0 0 7 14.5z"/>';
  const s={
    clear:day?sun:moon,
    partly:(day?sunS:moonS)+cloudP,
    cloud:cloud,
    fog:'<path class="haze" d="M4 8.5h16"/><path class="haze" d="M3 12.5h15"/><path class="haze" d="M6 16.5h13"/>',
    rain:cloudHi+'<g class="fall"><path d="M8.8 17.5l-.9 2.6"/><path d="M12.8 17.5l-.9 2.6"/><path d="M16.8 17.5l-.9 2.6"/></g>',
    snow:cloudHi+'<g class="fall"><circle class="dot" cx="8.6" cy="18.6" r=".9"/><circle class="dot" cx="12.6" cy="19.8" r=".9"/><circle class="dot" cx="16.6" cy="18.6" r=".9"/></g>',
    storm:cloudHi+'<path class="flash" d="M13 14.5l-2 3.6h3l-2 3.6"/>'
  }[kind];
  return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">'+s+'</svg>';
}
let haveWx=false;
function render(j){
  const c=j.current,d=j.daily,r=Math.round;
  $("glyph").innerHTML=icon(KIND(c.weather_code),c.is_day!==0);
  $("temp").innerHTML=r(c.temperature_2m)+"<sup>°C</sup>";
  $("cond").textContent=NAME(c.weather_code)+" in Cairo";
  $("meta").innerHTML="<span>High <b>"+r(d.temperature_2m_max[0])+"°</b></span><span>Low <b>"+r(d.temperature_2m_min[0])+"°</b></span><span>Feels <b>"+r(c.apparent_temperature)+"°</b></span><span>Humidity <b>"+r(c.relative_humidity_2m)+"%</b></span>";
  const days=$("days");days.textContent="";
  for(let i=1;i<4&&i<d.time.length;i++){
    const wd=new Date(d.time[i]+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"short",timeZone:"UTC"});
    const el=document.createElement("div");el.className="day";el.title=NAME(d.weather_code[i]);
    el.innerHTML="<span>"+wd+"</span><span class=\"mini\">"+icon(KIND(d.weather_code[i]),true)+"</span><b>"+r(d.temperature_2m_max[i])+"° / "+r(d.temperature_2m_min[i])+"°</b>";
    days.appendChild(el);
  }
  haveWx=true;
}
const KEY="lifeos-hero-wx";
try{const c=JSON.parse(localStorage.getItem(KEY)||"null");if(c&&Date.now()-c.t<3*36e5)render(c.j);}catch(e){}
async function load(){
  try{
    const res=await fetch(WX,{cache:"no-store"});if(!res.ok)throw new Error(res.status);
    const j=await res.json();render(j);
    try{localStorage.setItem(KEY,JSON.stringify({t:Date.now(),j:j}))}catch(e){}
    setTimeout(load,30*6e4);
  }catch(e){
    if(!haveWx){$("cond").textContent="Weather unavailable";$("meta").textContent="Couldn't reach the forecast. Trying again in 2 minutes.";}
    setTimeout(load,2*6e4);
  }
}
load();

/* ---- My Manifesto: one line at a time, 20s each, pauses while the pointer is on it ---- */
const lines=Array.isArray(window.MANIFESTO)?window.MANIFESTO:[];
const rail=$("rail"),slide=$("slide");
let mi=Math.floor(Math.random()*Math.max(1,lines.length)),busy=false;
lines.forEach(()=>{const s=document.createElement("i");s.appendChild(document.createElement("b"));rail.appendChild(s);});
function paint(){
  $("line").textContent=lines[mi][0];$("sub").textContent=lines[mi][1]||"";
  [...rail.children].forEach((s,k)=>{s.classList.remove("on");if(k===mi){void s.offsetWidth;s.classList.add("on");}});
}
function advance(){
  if(busy||!lines.length)return;
  if(reduce){mi=(mi+1)%lines.length;paint();return;}
  busy=true;slide.classList.add("out");
  setTimeout(()=>{mi=(mi+1)%lines.length;paint();slide.classList.remove("out");busy=false;},450);
}
if(lines.length){
  paint();
  rail.addEventListener("animationend",e=>{if(e.animationName==="fill")advance();});
  if(reduce)setInterval(advance,2e4);
  $("next").addEventListener("click",advance);
}else $("mani").hidden=true;

/* ---- Phone: page dots ---- */
const card=$("card"),dots=[...$("dots").children];
function syncDots(){const n=Math.round(card.scrollLeft/Math.max(1,card.clientWidth));dots.forEach((d,k)=>d.classList.toggle("on",k===n));}
card.addEventListener("scroll",syncDots,{passive:true});
dots.forEach((d,k)=>d.addEventListener("click",()=>card.scrollTo({left:k*card.clientWidth,behavior:reduce?"auto":"smooth"})));

/* ---- Load sequence: clock rolls in, verse and weather fade up, the North Star lights star by star.
   Once a day: after it plays, later loads that day skip it (no .js class from the head script) ---- */
const INTRO="lifeos-hero-intro";
let started=false;
function start(){
  if(started)return;started=true;
  if(reduce||!root.classList.contains("js")){settled=true;return;}
  try{localStorage.setItem(INTRO,pd.format(new Date()))}catch(e){}
  root.classList.add("go");
  setTimeout(()=>{root.classList.remove("js","go");settled=true;},2900);
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
setTimeout(start,1500);
})();
</script>
</body></html>
