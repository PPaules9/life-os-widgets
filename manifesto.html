<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Manifesto Rotator</title></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,300&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: one principle at a time, large; a dot rail shows position; new line each visit and every 20s. Dark look to match the Life OS page. */
:root{
  --bg:#141020; --fg:#efeafb; --muted:#9b90bd; --accent:#b388ff; --line:#2b2347;
  --display:"Fraunces",Georgia,serif; --body:"Manrope",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.wrap{display:flex;flex-direction:column;gap:14px;min-height:130px;justify-content:center}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px}
.foot button{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;letter-spacing:.08em;padding:4px 10px;border-radius:999px;cursor:pointer}
.foot button:hover,.foot button:focus-visible{color:var(--fg);border-color:var(--accent);outline:none}
.line{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;max-width:28ch;transition:opacity .35s}
.line.fade{opacity:0}
.sub{font-family:var(--display);font-style:italic;font-weight:300;font-size:17px;color:var(--muted);max-width:60ch}
.rail{display:flex;gap:6px}
.rail i{width:18px;height:3px;border-radius:2px;background:var(--line)}
.rail i.on{background:var(--accent)}
@media (max-width:560px){.line{font-size:24px}}
@media (prefers-reduced-motion:reduce){.line{transition:none}}
</style>
<div class="wrap">
  <div class="eyebrow">My Manifesto</div>
  <div class="line" id="line"></div>
  <div class="sub" id="sub"></div>
  <div class="foot"><div class="rail" id="rail"></div><button id="next" type="button">Next ›</button></div>
</div>
<script>
const lines=[
["Jesus was with Joseph, so Joseph was a successful man.","God first. Everything else follows."],
["Build companies, not features.","Think in systems, not tasks."],
["Speed with accuracy.","Reversible decisions fast. Irreversible ones carefully."],
["80/20 everything.","Protect the few things that move the needle."],
["Clear ownership.","Every outcome has one owner, measured on results."],
["Small, high-quality teams.","Hire people who do the work better than me."],
["Calm. Calculated. Never reactive.","The room follows the calmest person in it."],
["Archive, never delete.","Friday: a ten-minute sweep."]
];
let i=Math.floor(Math.random()*lines.length);
const rail=document.getElementById("rail");
lines.forEach(()=>rail.appendChild(document.createElement("i")));
const el=document.getElementById("line"),sub=document.getElementById("sub");
function show(){
  el.textContent=lines[i][0]; sub.textContent=lines[i][1];
  [...rail.children].forEach((d,k)=>d.classList.toggle("on",k===i));
}
function advance(){
  el.classList.add("fade");
  setTimeout(()=>{i=(i+1)%lines.length;show();el.classList.remove("fade");},350);
}
show();
let timer=setInterval(advance,20000);
document.getElementById("next").addEventListener("click",()=>{clearInterval(timer);advance();timer=setInterval(advance,20000);});
</script>

</body></html>
