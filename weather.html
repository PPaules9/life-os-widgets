<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cairo Weather</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: big temperature with a condition glyph, then high/low and a 3-day strip. Dark look to match the Life OS page. Data: Open-Meteo, no key. */
:root{--bg:#141020;--fg:#efeafb;--muted:#9b90bd;--accent:#b388ff;--line:#2b2347;--display:"Fraunces",Georgia,serif;--body:"Manrope",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
html,body{background:transparent}
body{margin:0;color:var(--fg);font-family:var(--body);box-sizing:border-box}
.card{background:var(--bg);border-radius:16px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;min-height:100%}
.wrap{display:flex;flex-direction:column;gap:10px;min-height:120px;justify-content:center}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.now{display:flex;align-items:center;gap:14px}
.temp{font-family:var(--display);font-weight:300;font-size:52px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.temp sup{font-size:20px;color:var(--muted);vertical-align:top;margin-left:2px}
.glyph{width:44px;height:44px;flex:0 0 auto}
.glyph svg{width:100%;height:100%;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cond{display:flex;flex-direction:column;gap:2px;min-width:0}
.cond b{font-size:14px;font-weight:700}
.cond span{font-size:12px;color:var(--muted)}
.days{display:flex;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.day{flex:1;display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--muted)}
.day b{color:var(--fg);font-size:12px;font-variant-numeric:tabular-nums}
.err{font-size:12px;color:var(--muted)}
</style></head><body>
<div class="card">
<div class="wrap">
  <div class="eyebrow">Cairo · now</div>
  <div class="now">
    <div class="glyph" id="glyph"></div>
    <div class="temp" id="temp">--<sup>°C</sup></div>
    <div class="cond"><b id="cond">Loading…</b><span id="hl"></span></div>
  </div>
  <div class="days" id="days"></div>
</div>
<script>
const URL_="https://api.open-meteo.com/v1/forecast?latitude=30.0444&longitude=31.2357&current=temperature_2m,apparent_temperature,weather_code,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Africa%2FCairo&forecast_days=4";
const sun='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const cloud='<svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.3 4.5 4.5 0 0 0 7 18z"/></svg>';
const partly='<svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M9 19h9a3.5 3.5 0 0 0 .5-6.96A5 5 0 0 0 8.9 11.4 3.8 3.8 0 0 0 9 19z"/></svg>';
const rain='<svg viewBox="0 0 24 24"><path d="M7 15h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 6.3 4.5 4.5 0 0 0 7 15z"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg>';
const fog='<svg viewBox="0 0 24 24"><path d="M4 10h16M4 14h16M6 18h12"/></svg>';
const storm='<svg viewBox="0 0 24 24"><path d="M7 14h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 5.3 4.5 4.5 0 0 0 7 14z"/><path d="M13 14l-2 4h3l-2 4"/></svg>';
function desc(c){
  if(c===0)return["Clear sky",sun]; if(c<=2)return["Partly cloudy",partly]; if(c===3)return["Overcast",cloud];
  if(c<=48)return["Fog",fog]; if(c<=57)return["Drizzle",rain]; if(c<=67)return["Rain",rain]; if(c<=77)return["Snow",rain];
  if(c<=82)return["Showers",rain]; if(c<=86)return["Snow showers",rain]; return["Thunderstorm",storm];
}
(async()=>{
  try{
    const r=await fetch(URL_); const j=await r.json();
    const cur=j.current, d=j.daily, [name,g]=desc(cur.weather_code);
    document.getElementById("glyph").innerHTML=g;
    document.getElementById("temp").innerHTML=Math.round(cur.temperature_2m)+"<sup>°C</sup>";
    document.getElementById("cond").textContent=name;
    document.getElementById("hl").textContent="H "+Math.round(d.temperature_2m_max[0])+"° · L "+Math.round(d.temperature_2m_min[0])+"° · feels "+Math.round(cur.apparent_temperature)+"° · "+cur.relative_humidity_2m+"% humidity";
    const days=document.getElementById("days");
    for(let i=1;i<4;i++){
      const dt=new Date(d.time[i]+"T00:00:00"); const wd=dt.toLocaleDateString("en-GB",{weekday:"short"});
      const el=document.createElement("div"); el.className="day";
      el.innerHTML="<span>"+wd+"</span><b>"+Math.round(d.temperature_2m_max[i])+"° / "+Math.round(d.temperature_2m_min[i])+"°</b><span>"+desc(d.weather_code[i])[0]+"</span>";
      days.appendChild(el);
    }
  }catch(e){document.getElementById("cond").textContent="Weather unavailable";document.getElementById("hl").textContent="Could not reach the forecast service.";}
})();
</script>
</div>
</body></html>
